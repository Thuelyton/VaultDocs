# =============================================================
# Render Blueprint — VaultDocs API
# Docs: https://render.com/docs/blueprint-spec
# Use: render.com/dashboard -> New -> Blueprint -> point to repo
# =============================================================
services:
  - type: web
    name: vaultdocs-api
    runtime: node
    plan: free
    rootDir: apps/api
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Node 20 LTS — last version that still supports the legacy AWS SDK v3
    # crypto path used by @aws-sdk/client-s3 + sharp without native rebuilds.
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # --- MongoDB Atlas (sync:false so Render prompts in the UI)
      - key: MONGO_URI
        sync: false
      # --- JWT
      - key: JWT_SECRET
        sync: false
      # --- Cloudflare R2
      # NOTE: bucket name "vaultdocs-api" matches the user's existing bucket.
      # If you create a new bucket, update this value in Render's UI.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: vaultdocs-api
      # Leave R2_PUBLIC_URL empty in production — we use presigned URLs only.
      - key: R2_PUBLIC_URL
        value: ""
      # --- Gemini AI (optional — uploads work without it)
      - key: GEMINI_API_KEY
        sync: false
      # --- CORS: comma-separated allowed origins.
      # Update after Vercel deploy with the real URL (no trailing slash).
      - key: CORS_ORIGIN
        value: https://placeholder.vercel.app
